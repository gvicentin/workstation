# Use a terminfo entry that actually advertises italics + truecolor.
# tmux-256color was compiled into ~/.terminfo from scratchpad/tmux-256color.src.
set -g default-terminal "tmux-256color"

# Declare what the OUTER terminal supports (features are colon-separated,
# NOT comma-separated - a comma starts a new term entry).
set -as terminal-features ",xterm-ghostty:italics:RGB"
set -as terminal-features ",xterm-256color:italics:RGB"

# Change prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Prevent C-[ (used in vim) to be a prefix
set -s escape-time 0

# Enable mouse
set -g mouse on

# Windows numbering starting at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split window keybinds.
# Also change it to split using the current directory (cwd)
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Enable vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'                 # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'       # resposive options
set -g @plugin 'tmux-plugins/tmux-yank'           # yank text to clipboard
# set -g @plugin 'odedlaz/tmux-onedark-theme'

# Visuals
set-option -g status-position top
set-option -g status-style "bg=#cab9b2,fg=#0a0a0a"
set-option -g status-left-length 64
set-window-option -g window-status-style "bg=#dfd9cf,fg=#585858"
set-window-option -g window-status-current-style "bg=#cab9b2,fg=#0a0a0a"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
